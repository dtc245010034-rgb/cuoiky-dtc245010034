name: dtc245010034

# Website quảng bá sản phẩm: WordPress (php-fpm) + MySQL + phpMyAdmin sau Nginx HTTPS.
#   frontend : mạng thường, có cổng publish ra host (chỉ Nginx).
#   backend  : internal: true — không có đường ra Internet, không publish cổng.
#   egress   : mạng thường, chỉ dùng cho wpcli (profile "setup") để tải theme/plugin.
#   monitoring: internal: true — Prometheus, Grafana, cAdvisor và các exporter; không ra Internet,
#               không publish cổng. Nginx join mạng này và proxy ra 127.0.0.1:3001/9090/8082.
#   dockerapi : internal: true, subnet cố định — chỉ docker-socket-proxy và promtail (đọc log qua Docker API).
#               Loki và Promtail nằm thêm trong monitoring; Nginx proxy Loki ra 127.0.0.1:3100 (chỉ đọc).

# Bí mật: Docker secrets dạng file (secrets/, sinh bằng scripts/gen-secrets.sh) mount tại /run/secrets.
# Compose không dùng Swarm nên đây là bind mount file KHÔNG mã hóa; lợi ích là mật khẩu không nằm trong
# environment/argv nên không lộ qua docker inspect, docker compose config hay log.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.4.13
    container_name: dtc245010034-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      # root chỉ đăng nhập qua localhost trong container
      MYSQL_ROOT_HOST: localhost
      # Không dùng MYSQL_DATABASE/MYSQL_USER của image (sẽ cấp ALL PRIVILEGES);
      # db/init/01-wordpress-user.sh tạo DB + user với quyền tối thiểu.
      WP_DB_NAME: ${MYSQL_DATABASE:?đặt trong .env}
      WP_DB_USER: ${MYSQL_USER:?đặt trong .env}
      # user giám sát (db/init/02-exporter-user.sh); mật khẩu các user đọc từ /run/secrets
      EXPORTER_DB_USER: ${MYSQL_EXPORTER_USER:?đặt trong .env}
      # wp_user và exporter chỉ đăng nhập được từ subnet backend (không dùng host '%')
      DB_CLIENT_SUBNET: ${BACKEND_SUBNET:-10.250.20.0/24}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
    secrets:
      - mysql_root_password
      - mysql_password
      - mysql_exporter_password
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    mem_limit: 768m
    healthcheck:
      # 127.0.0.1 (TCP): server tạm lúc khởi tạo chỉ nghe socket nên chưa báo healthy sớm.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging: *default-logging

  wordpress:
    image: wordpress:7.1.3-php8.4-fpm
    container_name: dtc245010034-wordpress
    restart: unless-stopped
    user: www-data
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST:-db:3306}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/mysql_password
      WORDPRESS_CONFIG_EXTRA: |
        define('DISALLOW_FILE_EDIT', true);
        define('FORCE_SSL_ADMIN', true);
        define('WP_HOME', 'https://localhost:${NGINX_HTTPS_PORT:-8443}');
        define('WP_SITEURL', 'https://localhost:${NGINX_HTTPS_PORT:-8443}');
        define('WP_MEMORY_LIMIT', '256M');
    secrets:
      - mysql_password
    volumes:
      - wp_html:/var/www/html
      - ./wordpress/uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini:ro
      - ./wordpress/zz-fpm-tuning.conf:/usr/local/etc/php-fpm.d/zz-tuning.conf:ro
    networks:
      - backend
    mem_limit: 512m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  nginx:
    image: nginx:1.30.6-alpine
    container_name: dtc245010034-nginx
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_healthy
      phpmyadmin:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-8080}:8080"
      - "${NGINX_HTTPS_PORT:-8443}:8443"
      # phpMyAdmin chỉ qua loopback (Docker bỏ qua ufw với cổng publish)
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:8081"
      # công cụ giám sát: cũng chỉ loopback
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3001"
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
      - "127.0.0.1:${CADVISOR_PORT:-8082}:8082"
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - wp_html:/var/www/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs/server.crt:/etc/nginx/certs/server.crt:ro
    # Khóa TLS và htpasswd là secrets (không còn bind mount thư mục có khóa chmod 600 của user host)
    secrets:
      - tls_key
      - nginx_htpasswd
    networks:
      - frontend
      - backend
      - monitoring
    mem_limit: 64m
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8088/stub_status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    container_name: dtc245010034-phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      PMA_ARBITRARY: "0"
    networks:
      - backend
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  # ---------------- Giám sát ----------------
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: dtc245010034-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      # reload cấu hình từ trong container; Nginx chặn /-/quit và /-/reload (403)
      - --web.enable-lifecycle
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
    networks:
      - monitoring
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: dtc245010034-node-exporter
    restart: unless-stopped
    # Không dùng network_mode: host (phá cô lập mạng) → node_network_* chỉ là của netns container;
    # CPU/RAM/đĩa/load vẫn là của host nhờ pid: host + mount / (ro).
    pid: host
    hostname: dtc245010034-host   # tên hiển thị trong dashboard thay cho id container
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|run/.+|snap/.+)($$|/)
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: dtc245010034-cadvisor
    restart: unless-stopped
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      # giữ nhãn gọn: chỉ nhãn compose cần cho truy vấn (tránh hàng chục nhãn container_label_*)
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project
      - --disable_metrics=percpu,sched,tcp,udp,advtcp,process,hugetlb,referenced_memory,resctrl,cpu_topology
    # Đặc quyền bắt buộc: chạy root + mount (ro) /, /sys, /var/lib/docker, /var/run (docker.sock,
    # để gắn tên/nhãn container) và /dev/disk. Không privileged. Xem README mục hardening.
    user: root
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  # Image scratch (không shell/wget) → không có healthcheck; trạng thái theo dõi bằng metric up/nginx_up.
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.3
    container_name: dtc245010034-nginx-exporter
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://nginx:8088/stub_status
    networks:
      - monitoring
    mem_limit: 32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.21.0
    container_name: dtc245010034-mysqld-exporter
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Mật khẩu nằm trong file cấu hình (secret), không ở command/environment → không lộ qua docker inspect.
    command:
      - --config.my-cnf=/etc/mysqld-exporter.cnf
      - --mysqld.address=db:3306
    secrets:
      - source: mysqld_exporter_cnf
        target: /etc/mysqld-exporter.cnf
    networks:
      - monitoring
      - backend   # chỉ để tới db:3306
    mem_limit: 64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9104/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.2.4
    container_name: dtc245010034-grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?đặt trong .env}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password   # chỉ có tác dụng khi khởi tạo DB lần đầu
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Truy cập bằng http://127.0.0.1:3001 (qua Nginx); websocket /api/live kiểm tra Origin theo URL này
      GF_SERVER_ROOT_URL: http://127.0.0.1:${GRAFANA_PORT:-3001}/
      GF_LIVE_ALLOWED_ORIGINS: http://127.0.0.1:${GRAFANA_PORT:-3001}
      GOMEMLIMIT: 320MiB  # ép Go GC trước khi chạm mem_limit
    secrets:
      - grafana_admin_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
    # Grafana 13: anon ~220 MiB + ~150 MiB file mmap (binary) → 256m/384m chạm trần (ContainerHighMemory)
    mem_limit: 512m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # ---------------- Log tập trung ----------------
  # Mount docker.sock ":ro" KHÔNG giới hạn Docker API (ro chỉ chặn ghi vào file socket; mọi lệnh API
  # vẫn chạy được, kể cả tạo container). Proxy này chỉ cho GET vài đường dẫn đọc; mạng dockerapi
  # là internal và chỉ nối promtail.
  docker-socket-proxy:
    image: wollomatic/socket-proxy:1.13.1
    container_name: dtc245010034-docker-socket-proxy
    restart: unless-stopped
    user: "65534:${DOCKER_GID:?đặt trong .env (getent group docker | cut -d: -f3)}"
    command:
      - -listenip=0.0.0.0
      - -allowfrom=10.250.250.0/29
      - -allowhealthcheck
      - -loglevel=INFO
    environment:
      # Chỉ GET: ping, version, danh sách container, inspect và log của 1 container, danh sách mạng
      # (docker_sd của Promtail gọi GET /networks để tính nhãn mạng; không có thì SD báo Forbidden).
      # Chặn: archive, export, attach, exec, images, volumes, ... và mọi POST/PUT/DELETE.
      SP_ALLOW_GET: '/(v1\.[0-9]+/)?(_ping|version|networks|containers/json|containers/[0-9a-zA-Z_.-]+/(json|logs))'
      SP_ALLOW_HEAD: '/(v1\.[0-9]+/)?_ping'
      # Method khác: regex không bao giờ khớp → trả 403 (bỏ trống thì proxy trả 405).
      SP_ALLOW_POST: '/deny-all'
      SP_ALLOW_PUT: '/deny-all'
      SP_ALLOW_DELETE: '/deny-all'
      SP_ALLOW_PATCH: '/deny-all'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - dockerapi
    read_only: true
    mem_limit: 32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging: *default-logging

  # Chạy một lần: cấp quyền ghi volume positions cho Promtail (user non-root 10001). Dùng lại image
  # Promtail (đã có bash/chown) nên không thêm image nào; không mạng, rootfs read-only, chỉ cap CHOWN.
  log-init:
    image: grafana/promtail:3.6.11
    container_name: dtc245010034-log-init
    restart: "no"
    user: root
    entrypoint: ["bash", "-c", "chown 10001:10001 /positions"]
    volumes:
      - promtail_positions:/positions
    network_mode: none
    read_only: true
    mem_limit: 16m
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt:
      - no-new-privileges:true

  # Image Loki là distroless (không shell/wget/curl) — cố ý, không nhét công cụ vào để có healthcheck.
  # Như nginx-exporter: không healthcheck; theo dõi bằng up{job="loki"} + rule TargetDown trong Prometheus.
  loki:
    image: grafana/loki:3.7.9
    container_name: dtc245010034-loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki-config.yml
    volumes:
      - loki_data:/loki
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ./monitoring/loki/rules:/etc/loki/rules:ro
    networks:
      - monitoring
    read_only: true
    tmpfs:
      - /tmp   # rule_path của ruler
    mem_limit: 256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # Promtail đã deprecated (EOL) — 3.6.11 là tag 3.x cuối cùng; thay thế: Grafana Alloy.
  promtail:
    image: grafana/promtail:3.6.11
    container_name: dtc245010034-promtail
    restart: unless-stopped
    user: "10001:10001"
    depends_on:
      log-init:
        condition: service_completed_successfully
      loki:
        condition: service_started   # Loki không có healthcheck (distroless); Promtail tự thử lại khi push
      docker-socket-proxy:
        condition: service_healthy
    command:
      - -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - promtail_positions:/positions
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
    networks:
      - dockerapi
      - monitoring
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 128m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # image không có wget/curl nhưng có bash: gửi GET /ready qua /dev/tcp
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9080 && printf 'GET /ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging

  # Chạy một lần: docker compose --profile setup run --rm wpcli   (hoặc scripts/seed.sh)
  # Nối thêm mạng egress để tải theme/plugin, ghi vào volume wp_html dùng chung.
  wpcli:
    image: wordpress:cli-2.12.0-php8.4
    container_name: dtc245010034-wpcli
    profiles: ["setup"]
    user: "33:33"
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST:-db:3306}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/mysql_password
      WP_SITE_URL: https://localhost:${NGINX_HTTPS_PORT:-8443}
      WP_SITE_TITLE: ${WP_SITE_TITLE:-PhucTech Smart Home}
      WP_ADMIN_USER: ${WP_ADMIN_USER:?đặt trong .env}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:?đặt trong .env}
    secrets:
      - mysql_password
      - wp_admin_password   # seed.sh đọc qua stdin (--prompt=admin_password)
    volumes:
      - wp_html:/var/www/html
      - ./seed:/seed:ro
      - ./wordpress/uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini:ro
    networks:
      - backend
      - egress
    mem_limit: 512m
    entrypoint: ["sh", "/seed/seed.sh"]

# Subnet cố định (10.250.0.0/16 không trùng LAN 192.168.1.0/24, tailscale 100.64/10, bridge 172.x):
# grant DB theo subnet backend và allowlist Nginx theo subnet/gateway cần địa chỉ không đổi giữa các lần up.
networks:
  frontend:
    driver: bridge
    ipam:
      config:
        - subnet: 10.250.10.0/24
  backend:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${BACKEND_SUBNET:-10.250.20.0/24}   # cũng là DB_CLIENT_SUBNET của db
  egress:
    driver: bridge
    ipam:
      config:
        - subnet: 10.250.50.0/24
  monitoring:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.250.30.0/24
  # Chỉ docker-socket-proxy và promtail; subnet cố định để proxy allowlist theo CIDR.
  dockerapi:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.250.250.0/29

# File trong secrets/ (thư mục 700, file 644) do scripts/gen-secrets.sh tạo; không commit.
secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password
  mysql_password:
    file: ./secrets/mysql_password
  mysql_exporter_password:
    file: ./secrets/mysql_exporter_password
  wp_admin_password:
    file: ./secrets/wp_admin_password
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  mysqld_exporter_cnf:
    file: ./secrets/mysqld-exporter.cnf
  tls_key:
    file: ./secrets/server.key
  nginx_htpasswd:
    file: ./secrets/htpasswd

volumes:
  db_data:
  wp_html:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:
