name: dtc245010034

# Website quảng bá sản phẩm: WordPress (php-fpm) + MySQL + phpMyAdmin sau Nginx HTTPS.
#   frontend : mạng thường, có cổng publish ra host (chỉ Nginx).
#   backend  : internal: true — không có đường ra Internet, không publish cổng.
#   egress   : mạng thường, chỉ dùng cho wpcli (profile "setup") để tải theme/plugin.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.4.13
    container_name: dtc245010034-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?đặt trong .env}
      # root chỉ đăng nhập qua localhost trong container
      MYSQL_ROOT_HOST: localhost
      # Không dùng MYSQL_DATABASE/MYSQL_USER của image (sẽ cấp ALL PRIVILEGES);
      # db/init/01-wordpress-user.sh tạo DB + user với quyền tối thiểu.
      WP_DB_NAME: ${MYSQL_DATABASE:?đặt trong .env}
      WP_DB_USER: ${MYSQL_USER:?đặt trong .env}
      WP_DB_PASSWORD: ${MYSQL_PASSWORD:?đặt trong .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    mem_limit: 768m
    healthcheck:
      # 127.0.0.1 (TCP): server tạm lúc khởi tạo chỉ nghe socket nên chưa báo healthy sớm.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    logging: *default-logging

  wordpress:
    image: wordpress:7.1.3-php8.4-fpm
    container_name: dtc245010034-wordpress
    restart: unless-stopped
    user: www-data
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST:-db:3306}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define('DISALLOW_FILE_EDIT', true);
        define('FORCE_SSL_ADMIN', true);
        define('WP_HOME', 'https://localhost:${NGINX_HTTPS_PORT:-8443}');
        define('WP_SITEURL', 'https://localhost:${NGINX_HTTPS_PORT:-8443}');
        define('WP_MEMORY_LIMIT', '256M');
    volumes:
      - wp_html:/var/www/html
      - ./wordpress/uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini:ro
      - ./wordpress/zz-fpm-tuning.conf:/usr/local/etc/php-fpm.d/zz-tuning.conf:ro
    networks:
      - backend
    mem_limit: 512m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *default-logging

  nginx:
    image: nginx:1.30.6-alpine
    container_name: dtc245010034-nginx
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_healthy
      phpmyadmin:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-8080}:8080"
      - "${NGINX_HTTPS_PORT:-8443}:8443"
      # phpMyAdmin chỉ qua loopback (Docker bỏ qua ufw với cổng publish)
      - "127.0.0.1:${PHPMYADMIN_PORT:-8081}:8081"
    volumes:
      - wp_html:/var/www/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - frontend
      - backend
    mem_limit: 64m
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8088/stub_status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  phpmyadmin:
    image: phpmyadmin:5.2.3-apache
    container_name: dtc245010034-phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      PMA_ARBITRARY: "0"
    networks:
      - backend
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging

  # Chạy một lần: docker compose --profile setup run --rm wpcli   (hoặc scripts/seed.sh)
  # Nối thêm mạng egress để tải theme/plugin, ghi vào volume wp_html dùng chung.
  wpcli:
    image: wordpress:cli-2.12.0-php8.4
    container_name: dtc245010034-wpcli
    profiles: ["setup"]
    user: "33:33"
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      HOME: /tmp
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST:-db:3306}
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${MYSQL_USER}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
      WP_SITE_URL: https://localhost:${NGINX_HTTPS_PORT:-8443}
      WP_SITE_TITLE: ${WP_SITE_TITLE:-PhucTech Smart Home}
      WP_ADMIN_USER: ${WP_ADMIN_USER:?đặt trong .env}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:?đặt trong .env}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:?đặt trong .env}
    volumes:
      - wp_html:/var/www/html
      - ./seed:/seed:ro
      - ./wordpress/uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini:ro
    networks:
      - backend
      - egress
    mem_limit: 512m
    entrypoint: ["sh", "/seed/seed.sh"]

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  egress:
    driver: bridge

volumes:
  db_data:
  wp_html:
