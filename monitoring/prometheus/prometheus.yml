global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: dtc245010034

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: { instance: prometheus }

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels: { instance: host }

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels: { instance: cadvisor }

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels: { instance: nginx }

  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]
        labels: { instance: mysql }
