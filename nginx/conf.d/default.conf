# --- 8080: chuyển hướng sang HTTPS ---
server {
    listen 8080 default_server;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

# --- 8443: website WordPress qua HTTPS tự ký ---
server {
    listen 8443 ssl default_server;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /run/secrets/tls_key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    root  /var/www/html;
    index index.php;

    client_max_body_size 20m;

    include /etc/nginx/snippets/security-headers.conf;

    # Chặn file ẩn (trừ .well-known), file cấu hình và thông tin phiên bản
    location ~ /\.(?!well-known) { return 404; }
    location ~* /(wp-config\.php|wp-config-sample\.php|readme\.html|license\.txt)$ { return 404; }
    location = /xmlrpc.php { return 444; }

    # Không cho thực thi PHP trong thư mục upload
    location ~* ^/wp-content/uploads/.*\.(php|phtml|phar)$ { return 403; }

    # Đăng nhập: giới hạn tốc độ POST
    location = /wp-login.php {
        limit_req zone=wplogin burst=3 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/fastcgi-wp.conf;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/fastcgi-wp.conf;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?|ttf)$ {
        expires 7d;
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }
}

# --- 8081: phpMyAdmin (chỉ publish 127.0.0.1:8081 trên host) ---
server {
    listen 8081;
    server_name _;

    # Chỉ nhận nguồn từ host qua cổng publish 127.0.0.1: docker-proxy làm request mang IP gateway
    # mạng frontend (10.250.10.1, đã đo). Container ở mạng khác (vd. wordpress) → 403.
    allow 10.250.10.1;
    deny  all;
    client_max_body_size 20m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        resolver 127.0.0.11 valid=10s;
        set $pma http://phpmyadmin:80;
        proxy_pass $pma;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# --- 8088: stub_status cho exporter (KHÔNG publish ra host) ---
# Tách khỏi cổng 8080 vì cổng đó được publish: qua docker-proxy nguồn hiện là gateway frontend
# và vượt allow-list. Cổng này chỉ truy cập được từ subnet monitoring (và localhost).
server {
    listen 8088;
    server_name _;
    access_log off;

    location = /stub_status {
        allow 127.0.0.1;        # healthcheck của chính container nginx
        allow 10.250.30.0/24;   # chỉ subnet monitoring (nginx-exporter)
        deny  all;
        stub_status;
    }
    location / { return 404; }
}

# --- Giám sát: các listener dưới đây chỉ được publish ở 127.0.0.1 trên host ---
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# 3001: Grafana (đã có đăng nhập riêng). Cần websocket cho /api/live.
server {
    listen 3001;
    server_name _;

    # Chỉ nhận nguồn từ host qua cổng publish 127.0.0.1: docker-proxy làm request mang IP gateway
    # mạng frontend (10.250.10.1, đã đo). Container ở mạng khác (vd. wordpress) → 403.
    allow 10.250.10.1;
    deny  all;

    location / {
        resolver 127.0.0.11 valid=10s;
        set $grafana http://grafana:3000;
        proxy_pass $grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

# 9090: Prometheus — Basic Auth; chặn /-/quit và /-/reload (reload làm trong container).
server {
    listen 9090;
    server_name _;

    # Chỉ nhận nguồn từ host qua cổng publish 127.0.0.1: docker-proxy làm request mang IP gateway
    # mạng frontend (10.250.10.1, đã đo). Container ở mạng khác (vd. wordpress) → 403.
    allow 10.250.10.1;
    deny  all;

    auth_basic "Prometheus";
    auth_basic_user_file /run/secrets/nginx_htpasswd;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location ~ ^/-/(quit|reload) { return 403; }

    location / {
        resolver 127.0.0.11 valid=10s;
        set $prom http://prometheus:9090;
        proxy_pass $prom;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}

