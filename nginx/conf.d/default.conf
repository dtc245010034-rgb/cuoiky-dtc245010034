# 3100: Loki — Basic Auth, CHỈ ĐỌC. Allowlist các API truy vấn; push/delete/flush/ring/config... → 403.
server {
    listen 3100;
    server_name _;

    # Chỉ nhận nguồn từ host qua cổng publish 127.0.0.1: docker-proxy làm request mang IP gateway
    # mạng frontend (10.250.10.1, đã đo). Container ở mạng khác (vd. wordpress) → 403.
    allow 10.250.10.1;
    deny  all;

    auth_basic "Loki";
    auth_basic_user_file /run/secrets/nginx_htpasswd;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Chỉ GET/HEAD (truy vấn). POST (push, delete, query kiểu form) bị chặn.
    location ~ ^/(ready|metrics|loki/api/v1/(query|query_range|labels|label/[^/]+/values|series|index/stats|index/volume|index/volume_range|status/buildinfo|rules(/.*)?)|prometheus/api/v1/(rules|alerts))$ {
        limit_except GET HEAD { deny all; }
        resolver 127.0.0.11 valid=10s;
        set $loki http://loki:3100;
        proxy_pass $loki;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location / { return 403; }
}
