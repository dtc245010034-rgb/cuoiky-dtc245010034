worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 30;
    types_hash_max_size 2048;

    # Chỉ giới hạn POST (đăng nhập); GET/HEAD có key rỗng nên không bị đếm.
    map $request_method $login_limit_key {
        default "";
        POST    $binary_remote_addr;
    }
    limit_req_zone $login_limit_key zone=wplogin:10m rate=5r/m;
    limit_req_status 429;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    # JSON một dòng cho Promtail/Loki (escape=json: ký tự đặc biệt trong UA/URI không làm hỏng JSON).
    # Không ghi header Authorization hay body → không lộ mật khẩu. /var/log/nginx/access.log là
    # symlink tới /dev/stdout trong image nên Docker vẫn thu được.
    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"server_port":"$server_port",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_user_agent":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
